name: Deploy API to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Hostinger via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Execute remote deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          script: |
            mkdir -p ${{ secrets.HOSTINGER_PATH }}
            cd ${{ secrets.HOSTINGER_PATH }}
            if [ ! -d ".git" ]; then
              echo "🚀 Clonando repositorio por primera vez..."
              git clone https://github.com/huguinhbo2006/ren-api.git .
              cp .env.production.example .env
              mkdir -p database
              touch database/database.sqlite
              php artisan key:generate --force
            else
              echo "🔄 Actualizando repositorio existente..."
              git pull origin main
              mkdir -p database
              touch database/database.sqlite
            fi
            chmod +x deploy.sh
            ./deploy.sh
